<header class="text-center background-div">
  <div class="col ajustCenter" style="margin-top: 3rem">
    <div class="drop-effect">
      <img
        src="../../../assets/images/icono_flecha.jpeg"
        alt="Imagen con efecto de gota"
        width="100%"
        height="100%"
      />
    </div>
    <div class="title-home">
      <h3>Universidad Mariano Galvez</h3>
      <h1>Base de Datos II UMG</h1>
      <h3>Bienvenido " {{ username }} "</h3>
    </div>
  </div>
</header>

<div class="container-md mt-2">
  <div *ngIf="permisos">
    <br />
    <h2 class="text-center">
      Listado de Base de Datos:
      <span>
        <button
        class="btn btn-primary me-md-2"
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#createModal"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem; width: 150px"
      >
        + Crear Base de Datos
      </button>
      </span>
    </h2>


    <div class="container text-center">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3">
        <div class="col" *ngFor="let item of listDataBase">
          <div class="card" style="width: 18rem">
            <div class="card-header">{{ item?.databaseName || "" }}</div>
            <div class="tables">
              <h3 style="margin-top: 8px">Tablas:</h3>
              <ul
                class="list-group list-group-flush"
                *ngFor="let table of item?.tables; let i = index"
              >
                <li class="list-group-item table-item">
                  {{ i + 1 }}) {{ table.tableName }}
                </li>
              </ul>
            </div>
            <div class="card-body">
              <div class="d-grid gap-2 d-md-block">
                <button
                  class="btn btn-outline-danger me-md-2"
                  style="width: 40%"
                  type="button"
                  (click)="actionClickEjecutar(item?.databaseName,false)"
                >
                  Eliminar
                </button>
                <button
                  class="btn btn-outline-primary me-md-2"
                  style="width: 40%"
                  type="button"
                  (click)="clickEdit(item)"
                >
                  Editar
                </button>
              </div>
            </div>
          </div>
          <br />
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!permisos">
    <br />
    <app-is-empty
      descripcion="No tiene permisos para visualizar las tablas"
    ></app-is-empty>
  </div>
</div>


<div
  class="modal fade"
  id="createModal"
  tabindex="-1"
  aria-labelledby="createModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="createModalLabel">Crear Base de Datos</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col">
            <div class="input-group flex-nowrap input">
              <input
                type="text"
                class="form-control"
                placeholder="Nombre de Base Datos"
                aria-describedby="addon-wrapping"
                [(ngModel)]="basedatosname"
                (input)="onChangeValues()"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="actionClickEjecutar(basedatosname,true)"
          [disabled]="!validButton"
        >
          Confirmar
        </button>
      </div>
    </div>
  </div>
</div>
